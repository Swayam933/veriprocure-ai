services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veriprocure}
      POSTGRES_USER: ${POSTGRES_USER:-veriprocure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veriprocure} -d ${POSTGRES_DB:-veriprocure}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-veriprocure}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-veriprocure}?schema=public
      TELEGRAPH_BASE_URL: ${TELEGRAPH_BASE_URL:-https://devnode.telegraphprotocol.com}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "./node_modules/.bin/prisma db push && node server.js"

volumes:
  postgres_data:
